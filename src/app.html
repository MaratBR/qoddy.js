		<script>
			// Paint in the reader's theme from the first frame (see library.svelte.ts).
			try {
				var root = document.documentElement;
				var theme = localStorage.getItem('qoddy.theme');
				var mode = localStorage.getItem('qoddy.mode');
				if (theme) root.dataset.theme = theme;
				if (mode) root.dataset.mode = mode;
			} catch (e) {}
		</script>
